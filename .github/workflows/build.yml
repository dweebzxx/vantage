name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore vantage.sln

      - name: Build
        run: dotnet build vantage.sln --configuration Debug --no-restore

      # Only the shared tests run here. The server integration tests start real
      # Godot processes and need godot-mono, which this runner does not have;
      # they wait for the M9 CI matrix.
      - name: Test
        run: dotnet test tests/Vantage.Shared.Tests/Vantage.Shared.Tests.csproj --configuration Debug --no-build
